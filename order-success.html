<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedido Confirmado | Adega Express</title>
  <meta name="theme-color" content="#dc2626">

  <!-- Estilos CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .success-container {
      max-width: 600px;
      margin: 4rem auto;
      background: #ffffff;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      text-align: center;
      padding: 3rem 2rem;
    }

    .success-icon {
      font-size: 5rem;
      margin-bottom: 1rem;
      animation: bounce 1s ease;
    }

    .success-title {
      font-size: 2rem;
      color: var(--color-green);
      margin-bottom: 0.5rem;
    }

    .success-desc {
      color: var(--color-gray);
      margin-bottom: 2rem;
      font-size: 1.1rem;
    }

    .order-details-box {
      background: var(--bg-surface-subtle);
      border: 1px dashed var(--color-border);
      border-radius: var(--radius-sm);
      padding: 1.5rem;
      margin-bottom: 2rem;
      text-align: left;
    }

    .order-details-box h4 {
      margin-bottom: 1rem;
      color: var(--color-black);
    }

    .order-info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }

    .order-info-row strong {
      color: var(--color-black);
    }

    .btn-block {
      display: flex;
      width: 100%;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
      40% {transform: translateY(-20px);}
      60% {transform: translateY(-10px);}
    }
  </style>
</head>
<body style="background: #f4f5f7;">

  <!-- CABEÇALHO SIMPLIFICADO -->
  <header class="site-header">
    <div class="container">
      <div class="nav-wrapper" style="justify-content: center;">
        <a href="index.html" class="brand-logo" title="Adega Express - Home">
          <div class="brand-icon-box">🍺</div>
          <div class="brand-texts">
            <span class="brand-title">ADEGA <span class="brand-accent">EXPRESS</span></span>
          </div>
        </a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="success-container">
      <div class="success-icon">✅</div>
      <h1 class="success-title">Pedido Recebido!</h1>
      <p class="success-desc">Nossa equipe já está separando suas bebidas na câmara fria.</p>

      <div class="order-details-box">
        <h4>Detalhes da Entrega</h4>
        <div class="order-info-row">
          <span>Tempo Estimado:</span>
          <strong>15 a 20 minutos</strong>
        </div>
        <div class="order-info-row">
          <span>Status:</span>
          <strong style="color: var(--color-green);">Preparando para envio</strong>
        </div>
        <div class="order-info-row">
          <span>ID do Pedido:</span>
          <strong id="order-id-display">#0000</strong>
        </div>
      </div>

      <button class="btn btn-primary-red btn-block" onclick="window.location.href='index.html'">
        ← Voltar ao Cardápio
      </button>

    </div>
  </main>

  <script>
    // Gerar um ID de pedido aleatório
    document.getElementById('order-id-display').textContent = '#' + Math.floor(1000 + Math.random() * 9000);
  </script>
</body>
</html>
