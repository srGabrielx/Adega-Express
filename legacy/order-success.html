<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Pedido Confirmado | Adega Express 15 Min</title>
  <meta name="theme-color" content="#dc2626">

  <!-- Estilos CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .success-container {
      max-width: 560px;
      margin: 2.5rem auto;
      background: #ffffff;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      text-align: center;
      padding: 2.5rem 1.5rem;
      width: 100%;
    }

    .success-icon {
      font-size: 4.5rem;
      margin-bottom: 0.75rem;
    }

    .success-title {
      font-size: 1.85rem;
      color: var(--color-green);
      margin-bottom: 0.5rem;
    }

    .success-desc {
      color: var(--color-gray);
      margin-bottom: 1.75rem;
      font-size: 1rem;
    }

    .order-details-box {
      background: var(--bg-surface-subtle);
      border: 1px dashed var(--color-border);
      border-radius: var(--radius-sm);
      padding: 1.25rem;
      margin-bottom: 1.75rem;
      text-align: left;
    }

    .order-details-box h4 {
      margin-bottom: 0.85rem;
      color: var(--color-black);
      font-size: 1rem;
    }

    .order-info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .order-info-row strong {
      color: var(--color-black);
    }

    .success-actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
  </style>
</head>
<body>

  <!-- CABEÇALHO / NAVBAR STICKY -->
  <header class="site-header">
    <div class="container">
      <div class="nav-wrapper" style="justify-content: center;">
        <a href="index.html" class="brand-logo" title="Adega Express - Home">
          <div class="brand-icon-box">🍺</div>
          <div class="brand-texts">
            <span class="brand-title">ADEGA <span class="brand-accent">EXPRESS</span></span>
          </div>
        </a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="success-container">
      <div class="success-icon">✅</div>
      <h1 class="success-title">Pedido Confirmado!</h1>
      <p class="success-desc">Nossa equipe já está separando suas bebidas trincando a -2°C na câmara fria.</p>

      <div class="order-details-box">
        <h4>Detalhes da Entrega Express</h4>
        <div class="order-info-row">
          <span>Tempo Estimado:</span>
          <strong>15 a 20 minutos</strong>
        </div>
        <div class="order-info-row">
          <span>Status:</span>
          <strong style="color: var(--color-green);">Em Preparação</strong>
        </div>
        <div class="order-info-row">
          <span>Código do Pedido:</span>
          <strong id="order-id-display">#0000</strong>
        </div>
      </div>

      <div class="success-actions">
        <button type="button" class="btn btn-primary-red" onclick="window.location.href='index.html'">
          ← Voltar para o Cardápio
        </button>
        <button type="button" class="btn btn-outline-dark" onclick="window.location.href='history.html'">
          📋 Ver no Histórico de Pedidos
        </button>
      </div>

    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('id');
    document.getElementById('order-id-display').textContent = orderId ? ('#' + orderId) : ('#' + Math.floor(1000 + Math.random() * 9000));
  </script>
</body>
</html>
