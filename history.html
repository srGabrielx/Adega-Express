<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Meus Pedidos | Adega Express 15 Min</title>
  <meta name="theme-color" content="#dc2626">

  <!-- Estilos CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .history-container {
      max-width: 680px;
      margin: 1.5rem auto 3rem;
      padding: 0 1rem;
      width: 100%;
    }

    .history-card {
      background: #ffffff;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      border-left: 4px solid var(--color-green);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.85rem;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 0.65rem;
    }

    .history-id {
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--color-black);
    }

    .history-date {
      color: var(--color-gray);
      font-size: 0.8rem;
    }

    .history-status {
      background: var(--color-green-light);
      color: var(--color-green);
      padding: 0.2rem 0.65rem;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 800;
    }

    .history-item-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.45rem;
      font-size: 0.88rem;
    }

    .history-item-qty {
      font-weight: 800;
      margin-right: 0.4rem;
      color: var(--color-red);
    }

    .history-total {
      margin-top: 0.85rem;
      padding-top: 0.75rem;
      border-top: 1px dashed var(--color-border);
      display: flex;
      justify-content: space-between;
      font-weight: 800;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>

  <!-- CABEÇALHO / NAVBAR STICKY -->
  <header class="site-header">
    <div class="container">
      <div class="nav-wrapper">
        <a href="index.html" class="brand-logo" title="Adega Express - Home">
          <div class="brand-icon-box">🍺</div>
          <div class="brand-texts">
            <span class="brand-title">ADEGA <span class="brand-accent">EXPRESS</span></span>
            <span class="brand-subtitle">Delivery 15 Min • Subzero</span>
          </div>
        </a>
        <button type="button" class="btn-back-catalog" onclick="window.location.href='index.html'">
          ← Cardápio
        </button>
      </div>
    </div>
  </header>

  <main class="history-container">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem;">
      <h2 style="font-size: 1.35rem; font-weight: 900;">📋 Meus Pedidos</h2>
    </div>

    <div id="history-list">
      <!-- Pedidos renderizados aqui via JS -->
    </div>
  </main>

  <footer class="site-footer" style="padding-top: 2rem;">
    <div class="container">
      <div class="footer-bottom" style="border-top: none; padding-top: 0;">
        <div>© <span id="current-year">2026</span> Adega Express. Todos os direitos reservados.</div>
      </div>
    </div>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const historyList = document.getElementById("history-list");
      const orderHistory = JSON.parse(localStorage.getItem("adega_order_history") || "[]");

      if (orderHistory.length === 0) {
        historyList.innerHTML = `
          <div class="empty-cart-view">
            <div class="empty-cart-icon">📦</div>
            <h3>Nenhum pedido realizado ainda</h3>
            <p>Seus pedidos express finalizados aparecerão aqui automaticamente.</p>
            <button type="button" class="btn btn-primary-red" onclick="window.location.href='index.html'">
              Fazer meu primeiro pedido
            </button>
          </div>
        `;
        return;
      }

      orderHistory.slice().reverse().forEach(order => {
        const dateObj = new Date(order.date);
        const dateStr = dateObj.toLocaleDateString('pt-BR') + ' às ' + dateObj.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
        
        let itemsHtml = '';
        if (Array.isArray(order.items)) {
          order.items.forEach(item => {
            itemsHtml += `
              <div class="history-item-row">
                <div><span class="history-item-qty">${item.qty}x</span> ${item.name}</div>
                <div>R$ ${(item.price * item.qty).toFixed(2).replace('.', ',')}</div>
              </div>
            `;
          });
        }

        const card = document.createElement("div");
        card.className = "history-card";
        card.innerHTML = `
          <div class="history-header">
            <div>
              <div class="history-id">Pedido ${order.id}</div>
              <div class="history-date">${dateStr}</div>
            </div>
            <div class="history-status">${order.status || 'Concluído'}</div>
          </div>
          <div class="history-items" style="margin: 0.65rem 0;">
            ${itemsHtml}
          </div>
          <div class="history-total">
            <span>Total Pago</span>
            <span style="color: var(--color-red);">R$ ${Number(order.total || 0).toFixed(2).replace('.', ',')}</span>
          </div>
        `;
        historyList.appendChild(card);
      });
    });
  </script>
</body>
</html>
