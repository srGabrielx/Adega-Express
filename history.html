<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Pedidos | Adega Express</title>
  <meta name="theme-color" content="#dc2626">

  <!-- Estilos CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .history-container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .history-card {
      background: #ffffff;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: 1.5rem;
      margin-bottom: 1rem;
      border-left: 4px solid var(--color-green);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 0.75rem;
    }

    .history-id {
      font-weight: 800;
      font-size: 1.1rem;
    }

    .history-date {
      color: var(--color-gray);
      font-size: 0.85rem;
    }

    .history-status {
      background: var(--color-green-light);
      color: var(--color-green);
      padding: 0.2rem 0.6rem;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 800;
    }

    .history-item-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .history-item-qty {
      font-weight: 700;
      margin-right: 0.5rem;
      color: var(--color-gray);
    }

    .history-total {
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px dashed var(--color-border);
      display: flex;
      justify-content: space-between;
      font-weight: 800;
      font-size: 1.1rem;
    }

    .history-empty {
      text-align: center;
      padding: 4rem 1rem;
      background: #fff;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }

    .history-empty h3 {
      margin: 1rem 0;
      color: var(--color-black);
    }
  </style>
</head>
<body style="background: #f4f5f7;">

  <!-- CABEÇALHO -->
  <header class="site-header">
    <div class="container">
      <div class="nav-wrapper">
        <a href="index.html" class="brand-logo" title="Adega Express - Home">
          <div class="brand-icon-box">🍺</div>
          <div class="brand-texts">
            <span class="brand-title">ADEGA <span class="brand-accent">EXPRESS</span></span>
          </div>
        </a>
        <button class="btn-voltar" onclick="window.location.href='index.html'" style="background:var(--color-black); color:#fff; border:none; padding:0.5rem 1rem; border-radius:var(--radius-sm); cursor:pointer; font-weight:700;">
          ← Voltar ao Cardápio
        </button>
      </div>
    </div>
  </header>

  <main class="history-container">
    <h2 style="margin-bottom: 1.5rem; font-weight: 900;">📋 Histórico de Pedidos</h2>

    <div id="history-list">
      <!-- Pedidos renderizados aqui via JS -->
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const historyList = document.getElementById("history-list");
      const orderHistory = JSON.parse(localStorage.getItem("adega_order_history") || "[]");

      if (orderHistory.length === 0) {
        historyList.innerHTML = `
          <div class="history-empty">
            <div style="font-size: 4rem;">📦</div>
            <h3>Você ainda não tem pedidos</h3>
            <p style="color: var(--color-gray); margin-bottom: 1.5rem;">Quando você fizer um pedido, ele aparecerá aqui.</p>
            <button class="btn btn-primary-red" onclick="window.location.href='index.html'">Fazer meu primeiro pedido</button>
          </div>
        `;
        return;
      }

      // Ordenar do mais recente para o mais antigo
      orderHistory.reverse().forEach(order => {
        const dateObj = new Date(order.date);
        const dateStr = dateObj.toLocaleDateString('pt-BR') + ' às ' + dateObj.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
        
        let itemsHtml = '';
        order.items.forEach(item => {
          itemsHtml += `
            <div class="history-item-row">
              <div><span class="history-item-qty">${item.qty}x</span> ${item.name}</div>
              <div>R$ ${(item.price * item.qty).toFixed(2).replace('.', ',')}</div>
            </div>
          `;
        });

        const card = document.createElement("div");
        card.className = "history-card";
        card.innerHTML = `
          <div class="history-header">
            <div>
              <div class="history-id">Pedido ${order.id}</div>
              <div class="history-date">${dateStr}</div>
            </div>
            <div class="history-status">${order.status || 'Concluído'}</div>
          </div>
          <div class="history-items">
            ${itemsHtml}
          </div>
          <div class="history-total">
            <span>Total Pago</span>
            <span style="color: var(--color-red);">R$ ${order.total.toFixed(2).replace('.', ',')}</span>
          </div>
        `;
        historyList.appendChild(card);
      });
    });
  </script>
</body>
</html>
